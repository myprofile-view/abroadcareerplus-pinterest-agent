name: Create Pinterest Pin

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Pin topic/title"
        required: true
        default: "Offshore Instrument Technician Careers"
        type: string
      country:
        description: "Country or region"
        required: true
        default: "North Sea"
        type: string
      destination_url:
        description: "Exact article or career-guide URL"
        required: true
        default: "https://abroadcareerplus.com/"
        type: string

permissions:
  contents: read

jobs:
  create-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Create pin image and metadata
        run: |
          python agent.py \
            --title "${{ inputs.title }}" \
            --country "${{ inputs.country }}" \
            --url "${{ inputs.destination_url }}" \
            --output output
      - uses: actions/upload-artifact@v4
        with:
          name: pinterest-pin
          path: output/
